<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
  </head>
  <body>
    <div class="bg-slate-200 h-screen w-screen flex">
      <aside 
        id="sidebar"
        style="width:400px; transition:0.2s ease-in" 
        class="fixed top-0 left-0 h-full bg-red-200">
      </aside>
      <section
        id="main-content"
        style="margin-left:400px; transition:0.2s ease-in"
        class="p-8">
        <h1>Dashboard here</h1>
        <button onClick = "hideSideBar()" class="bg-blue-400 px-4 py-2">Toggler</button>
      </section>
    </div>
    <script src="./layoutControl.js" />
  </body>
</html>
