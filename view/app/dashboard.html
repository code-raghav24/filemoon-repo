<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="bg-slate-200 h-screen w-screen flex">
      <aside 
        id="sidebar"
        style="width:300px; transition:0.3s;background-image: linear-gradient(to right, #243949 0%, #517fa4 100%); " 
        class="absolute overflow-hidden top-0 left-0 h-full py-6 space-y-12">
        <div class="flex flex-col items-center">
          <img class="w-[90px] rounded-full " src="./public/images/profile-pic.jpg" alt="profile">
          <h1 class="text-md text-gray-200 font-bold">Raghav Sapkota</h1>
          <h3 class="text-sm text-gray-400 font-medium">raghav.sapkota@gmail.com</h3>
        </div>
        <div class="px-8 flex flex-col gap-4">
          <a href="#">
            <button class="bg-rose-400 hover:bg-rose-500 w-full font-bold rounded text-white py-1 flex justify-center items-center gap-3">
              <i class="ri-dashboard-line"></i>
              Dashboard
            </button>
          </a>
          <a href="#">
            <button class="bg-rose-400 hover:bg-rose-500 w-full font-bold rounded text-white py-1 flex justify-center items-center gap-3">
              <i class="ri-file-line"></i>
              My Files 
            </button>
          </a>
          <a href="#">
            <button class="bg-rose-400 hover:bg-rose-500 w-full font-bold rounded text-white py-1 flex justify-center items-center gap-3">
              <i class="ri-share-line"></i>
              Shared
            </button>
          </a>
          <a href="#">
            <button class="bg-rose-400 hover:bg-rose-500 w-full font-bold rounded text-white py-1 flex justify-center items-center gap-3">
              <i class="ri-logout-box-r-line"></i>
              Logout
            </button>
          </a>
        </div>
      </aside>

      <section
        id="main-content"
        style="margin:0px 0px 0px 300px; transition: all 0.3s"
        class="w-full h-screen">
        <nav class="px-6 w-full bg-white shadow-md flex justify-between items-center">
          <div class="flex items-center gap-2  py-2">
            <i class="ri-contrast-2-fill text-3xl text-violet-600"></i>
            <h1 class="text-xl font-medium">Filemoon</h1>
          </div>
          <div class="flex gap-2 ">
            <div class="bg-red-300 hover:bg-red-400 px-4 py-2 rounded">
              <i class="ri-logout-box-r-line"></i>
            </div>
            <div onClick="hideAndSeek()" class="bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded">
              <i class="ri-menu-line"></i>
            </div>
          </div>
        </nav>
        <div class="p-6 space-y-12">
          <h1>Dashboard</h1>
          <div class="grid grid-cols-4 gap-8">
            <div class="relative overflow-hidden bg-white shadow-sm h-32 rounded-lg flex flex-col items-center justify-center gap-2">
              <h1 class="text-2xl text-gray-600">Videos</h1>
              <h3 class="text-5xl ">1289</h3>
              <div class="absolute top-5 -left-5 w-24 h-24 bg-orange-500 rounded-full flex justify-center items-center">
                <div class="text-5xl text-white">
                  <i class="ri-video-line"></i>
                </div>
              </div>
            </div>

            <div class="relative overflow-hidden bg-white shadow-sm h-32 rounded-lg flex flex-col items-center justify-center gap-2">
              <h1 class="text-2xl text-gray-600">Audio</h1>
              <h3 class="text-5xl ">888</h3>
              <div class="absolute top-5 -left-5 w-24 h-24 bg-green-500 rounded-full flex justify-center items-center">
                <div class="text-5xl text-blue-600">
                  <i class="ri-music-2-fill"></i>
                </div>
              </div>
            </div>
            <div class="relative overflow-hidden bg-white shadow-sm h-32 rounded-lg flex flex-col items-center justify-center gap-2">
              <h1 class="text-2xl text-gray-600">PDF</h1>
              <h3 class="text-5xl ">555</h3>
              <div class="absolute top-5 -left-5 w-24 h-24 bg-gray-500 rounded-full flex justify-center items-center">
                <div class="text-5xl text-red-600">
                  <i class="ri-file-pdf-2-line"></i>
                </div>
              </div>
            </div>
            <div class="relative overflow-hidden bg-white shadow-sm h-32 rounded-lg flex flex-col items-center justify-center gap-2">
              <h1 class="text-2xl text-gray-600">Text</h1>
              <h3 class="text-5xl ">250</h3>
              <div class="absolute top-5 -left-5 w-24 h-24 bg-gray-500 rounded-full flex justify-center items-center">
                <div class="text-5xl text-red-600">
                  <i class="ri-file-pdf-2-line"></i>
                </div>
              </div>
            </div>
            <div class="bg-white col-span-2 px-6 py-4">
              <h4 class="text-gray-500 text-md">Recent files</h4>
            </div>
            <div class="bg-white col-span-2 px-6 py-4">
              <h4 class="text-gray-500 text-md">Recent files</h4>
            </div>
          </div>
        </div>
      </section>
    </div>
    <script src="./jsFiles/myfiles.js" />
  </body>
</html>
